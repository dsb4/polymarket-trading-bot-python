[package]
name = "rarb"
version = "0.1.0"
edition = "2021"
description = "Polymarket arbitrage bot - Rust rewrite"
authors = ["kmizzi"]

[[bin]]
name = "rarb"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "socks",
    "gzip",
] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decimal arithmetic (no floating point errors)
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Cryptography (EIP-712 + HMAC)
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
hex = "0.4"
rand = "0.8"

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "chrono",
    "rust_decimal",
] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Configuration
dotenvy = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
tokio-stream = "0.1"
async-trait = "0.1"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
mockito = "1"
approx = "0.5"
